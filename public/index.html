<html lang="id">

<title>MIDAS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23222429'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23f5b301'/%3E%3Ctext x='16' y='20.5' font-size='12' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23222429'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{--color-primary:#1e5a43;--color-bg:#f6f5ef;--color-neutral:#6f7a73;--layout-width:440px;
--bg:var(--color-bg);--card:#fff;--line:#e4e2d8;--line2:#d6d4c8;--sec:#edebe2;--txt:#16211c;--txt2:#4a504b;--mut:var(--color-neutral);--red:#c0392b;--blue:var(--color-primary);--amb:#c98a0b}
*{box-sizing:border-box}
body{margin:0;background:var(--color-bg);color:var(--txt);font:15px 'Plus Jakarta Sans',sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button,input,select,.num,.amt,time{font-family:inherit;font-variant-numeric:tabular-nums}
#app{max-width:var(--layout-width);margin:0 auto;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
#splash{position:fixed;inset:0;z-index:100;background:var(--color-bg);display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .brand{display:inline-flex;align-items:center;gap:14px;font-weight:800;font-size:30px;letter-spacing:.14em;color:var(--color-primary)}
#splash svg{width:72px;height:72px;filter:drop-shadow(0 6px 12px #1e5a4344)}
#splash .word{display:inline-flex}#splash .l{display:inline-block}
#splash .sq{transform-box:fill-box;transform-origin:center;animation:bSq .22s ease-out both}
#splash .coin{transform-box:fill-box;transform-origin:center;animation:bCoin .4s cubic-bezier(.3,1.5,.5,1) .18s both}
#splash .l{animation:bLet .2s ease-out both;animation-delay:calc(.5s + var(--i) * .07s)}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
@keyframes bSq{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes bCoin{0%{opacity:0;transform:translateY(-26px) scale(.7)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes bLet{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
header{padding:14px 14px 8px;text-align:center;font-weight:600;font-size:17px;position:sticky;top:0;background:var(--bg);z-index:2}
main{flex:1;padding-bottom:90px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
.in{color:var(--blue)}.ex{color:var(--red)}.mut{color:var(--mut)}
.mnav{display:flex;justify-content:space-between;align-items:center;padding:4px 14px 8px}
.mnav button{font-size:22px;padding:2px 14px}
.sum{display:flex;justify-content:space-around;padding:10px 0;border-block:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px}
.sum b{display:block;font-size:14px;margin-top:3px}
.scard{margin:8px 20px 12px;padding:20px;border-radius:24px;background:var(--color-primary);color:#fff;position:relative;overflow:hidden}
.scard:before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#ffffff1a 0 40%,#ffffff0d 40% 70%,transparent 70%)}
.scard>*{position:relative}
.scard .top{display:flex;align-items:center;justify-content:space-between}
.scard .ttl{font-size:13px;opacity:.8}
.scard .pn{display:flex;align-items:center;gap:2px;background:#ffffff1f;border-radius:999px;padding:2px}
.scard .pn button{width:28px;height:28px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center}
.scard .pn button:disabled{opacity:.35;cursor:not-allowed}
.scard .pn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.scard .pn span{font-size:12px;font-weight:600;min-width:64px;text-align:center}
.scard .big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:10px}
.scard .big small{font-size:18px;font-weight:600;opacity:.75;margin-right:6px}
.scard .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.scard .two div{background:#ffffff1f;border-radius:16px;padding:10px 12px;font-size:11px}
.scard .two div span{opacity:.75}
.scard .two b{display:block;font-size:15px;margin-top:2px}
.scard .two .inc{background:#4ade8026}
.scard .two .exp{background:#f8717126}
.scard .two .lbl{display:flex;align-items:center;gap:6px;opacity:1}
.scard .two .lbl i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%}
.scard .two .inc .lbl i{background:#4ade80;color:#0f3d2b}
.scard .two .exp .lbl i{background:#fca5a5;color:#7f1d1d}
.scard .two .lbl svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.scard .two .lbl em{font-style:normal;opacity:.85}
.dayw{padding:0 20px}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:20px 4px 10px;font-size:14px;font-weight:700}
.day span+span{font-size:13px;font-weight:400;color:var(--mut)}
.dcard{background:#fff;border-radius:20px;padding:4px 16px;box-shadow:0 1px 2px rgba(22,33,28,.04)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.row:first-child{border-top:0}
.row .ico{width:44px;height:44px;border-radius:50%;background:#e4f1e9;color:#1e5a43;display:flex;align-items:center;justify-content:center;font-weight:700}
.row .n{min-width:0}
.row .n>span{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n small{display:flex;align-items:center;gap:6px;margin-top:3px;color:var(--mut);font-size:12px;min-width:0}
.row .n small i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right}.row .amt b{display:block;font-size:14px;font-weight:700;white-space:nowrap}
.row .amt small{display:block;font-size:11px;color:#9aa39d;margin-top:3px}
.badge{flex:none;background:#eceee9;color:var(--mut);border-radius:999px;font-size:11px;font-weight:600;padding:1px 8px}
.badge.r{background:#fdf1dc;color:#8a5b14}
.fab{position:fixed;right:max(14px,calc(50% - 206px));bottom:calc(70px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--red);font-size:0;color:#fff;box-shadow:0 4px 14px #0008;z-index:3}
.fab::before,.fab::after{content:'';position:absolute;left:50%;top:50%;width:20px;height:3px;border-radius:2px;background:#fff;transform:translate(-50%,-50%)}
.fab::after{transform:translate(-50%,-50%) rotate(90deg)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:3;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:var(--layout-width);margin:0 auto;display:flex}
nav button{flex:1;padding:9px 0 8px;color:var(--mut);font-size:11px}
nav button.on{color:var(--red)}nav button i{display:block;font-style:normal;font-size:19px}
.seg{display:flex;gap:8px;padding:8px 14px}
.seg button{flex:1;border:1px solid var(--line2);border-radius:7px;padding:8px 0;color:var(--mut)}
.seg button.on{border-color:var(--red);color:var(--red)}
.st{padding:4px 20px 24px}
.st-pill{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--sec);border-radius:14px}
.st-pill button{padding:9px 0;border-radius:11px;font-weight:600;font-size:13px;color:var(--mut);transition:background .2s,color .2s,box-shadow .2s}
.st-pill button.on{background:#fff;color:var(--color-primary);box-shadow:0 1px 4px #0001}
.st .mnav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px;padding:0}
.st .mnav b{font-size:15px;font-weight:700}
.st .mnav button{width:34px;height:34px;border-radius:50%;background:#fff;font-size:18px;color:var(--txt);box-shadow:0 1px 3px #0001}
.st .mnav button:disabled{opacity:.35}
.st-card{background:#fff;border-radius:24px;padding:20px;margin-top:12px}
.st-hero{display:flex;align-items:center;gap:18px}
.st-donut{position:relative;width:132px;height:132px;flex:none}
.st-donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.st-donut circle{fill:none;stroke-width:15}
.st-donut .trk{stroke:var(--sec)}
.st-donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--mut)}
.st-donut .ctr b{font-size:15px;color:var(--txt);margin-top:2px}
.st-meta{min-width:0}
.st-meta small{font-size:12px;color:var(--mut)}
.st-meta .tot{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px;white-space:nowrap}
.st-meta .tot small{font-size:13px;font-weight:600;color:var(--mut);margin-right:3px}
.st-chip{display:inline-block;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:600;background:var(--sec);color:var(--txt2)}
.st-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.st-row:first-child{border-top:0}
.st-row .ic{width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.st-row .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-row .bar{height:5px;margin-top:7px;background:var(--sec)}
.st-row .bar i{background:currentColor}
.st-row .am{text-align:right}
.st-row .am b{display:block;font-size:14px;font-weight:700;white-space:nowrap}
.st-row .am small{font-size:11px;color:var(--mut)}
.ac{padding:0 20px 24px}
.ac-top{display:flex;align-items:center;justify-content:space-between;padding:20px 0 4px}
.ac-top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.ac-top button{display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:99px;background:var(--color-primary);color:#fff;font-size:13px;font-weight:600}
.ac-top svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
.ac-hero{margin-top:12px;padding:20px;border-radius:24px;background:var(--color-primary);color:#fff;position:relative;overflow:hidden}
.ac-hero::after{content:'';position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:#ffffff14}
.ac-hero>small{font-size:12px;opacity:.8}
.ac-hero .nw{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px;position:relative}
.ac-hero .nw small{font-size:15px;font-weight:600;opacity:.8;margin-right:4px}
.ac-hero .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.ac-hero .two div{padding:10px 12px;border-radius:16px;font-size:11px}
.ac-hero .two .a{background:#4ade8026}.ac-hero .two .l{background:#f8717126}
.ac-hero .two b{display:block;font-size:15px;margin-top:2px}
.ac-hero .lbl{display:flex;align-items:center;gap:6px}
.ac-hero .lbl i{display:grid;place-items:center;width:18px;height:18px;border-radius:50%}
.ac-hero .a .lbl i{background:#4ade80;color:#0f3d2b}
.ac-hero .l .lbl i{background:#fca5a5;color:#7f1d1d}
.ac-hero .lbl svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ac-hero .lbl em{font-style:normal;opacity:.85}
.ac-gh{display:flex;justify-content:space-between;align-items:baseline;padding:20px 4px 8px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.ac-gh.liab{color:var(--red)}
.ac-card{background:#fff;border-radius:20px;padding:4px 16px}
.ac-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line);width:100%;text-align:left;cursor:pointer}
.ac-row:first-child{border-top:0}
.ac-av{position:relative;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:13px;font-weight:800}
.ac-nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-bal{font-size:14px;font-weight:700;white-space:nowrap}
.set{padding:8px 20px 24px}
.set h2{margin:18px 4px 8px;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.set-card{background:#fff;border-radius:20px;padding:4px 16px}
.set-row{display:grid;grid-template-columns:44px minmax(0,1fr) 20px;gap:12px;align-items:center;width:100%;padding:13px 0;border-top:1px solid var(--line);text-align:left}
.set-row:first-child{border-top:0}
.set-ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center}
.set-ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.set-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.set-t b{font-size:14px;font-weight:600}.set-t small{font-size:12px;color:var(--mut)}
.set-row>svg{width:18px;height:18px;fill:none;stroke:#9aa39d;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.set-out{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:20px;padding:14px;border-radius:18px;background:#fdeeee;color:var(--red);font-weight:700;font-size:14px}
.set-out svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.set-v{text-align:center;color:#9aa39d;font-size:11px;margin-top:16px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 0;color:var(--mut)}.tabs button.on{color:var(--txt);border-bottom:2px solid var(--red)}
.accts-v2{padding:0 20px;max-width:100%;overflow-x:hidden}
.accts-title{margin:0;padding:24px 0 8px;font-size:26px;font-weight:800;letter-spacing:-.02em}
.accts-list{min-width:0}
.acct-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;margin-top:10px;background:#fff;border-radius:16px}

.grp2{display:flex;justify-content:space-between;align-items:baseline;padding:18px 4px 0;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.grp2.liab{color:var(--red)}
.acct-item.liab{background:#fdeeee}.acct-item.liab .acct-bal{color:var(--red)}
.acct-bal{font-size:14px;font-weight:700;white-space:nowrap}
.grp{background:var(--card);padding:7px 14px;display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--line2);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.bar i.w{background:var(--amb)}.bar i.d{background:var(--red)}
.bud{padding:11px 14px;border-bottom:1px solid var(--line)}.bud>div:first-child{display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--mut);padding:60px 20px}

.v2-head{display:flex;align-items:center;gap:12px;padding:24px 0 8px}
.v2-head .back{width:44px;height:44px;border-radius:50%;border:1px solid #ecebe4;background:#fff;display:flex;align-items:center;justify-content:center;color:#16211c;flex:none}
.v2-head .ttl{flex:1;font-size:20px;font-weight:700;letter-spacing:-.01em}
.v2-head .add{height:44px;padding:0 16px;border-radius:999px;background:#1e5a43;color:#fff;font-size:14px;font-weight:600}
.rec-empty{margin:16px 0 0;padding:32px 24px;border-radius:24px;background:#fff;display:flex;flex-direction:column;align-items:center;text-align:center}
.rec-empty .ico{width:72px;height:72px;border-radius:50%;background:#e4f1e9;color:#1e5a43;display:flex;align-items:center;justify-content:center}
.rec-empty .t{font-size:18px;font-weight:700;margin-top:16px}
.rec-empty .d{font-size:14px;color:#6f7a73;margin-top:6px;max-width:280px;text-wrap:pretty}
.rec-empty button{margin-top:20px;height:48px;padding:0 24px;border-radius:999px;background:#1e5a43;color:#fff;font-size:14px;font-weight:600}
.sec{padding:9px 14px;background:var(--sec);color:var(--mut);font-size:12px;display:flex;justify-content:space-between}
.sec button{color:var(--red)}
.sub{padding-left:32px;color:var(--txt2)}
.mi{display:flex;justify-content:space-between;width:100%;padding:14px;border-bottom:1px solid var(--line);text-align:left}
.mi.g{display:grid;grid-template-columns:44px 1fr 20px;align-items:center;gap:12px}
.mi .ic{width:44px;height:44px;border-radius:50%;background:#e4f1e9;display:flex;align-items:center;justify-content:center}
.mi .tt{display:flex;flex-direction:column;gap:2px}
#fm{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto}
#fm .in-wrap{max-width:var(--layout-width);margin:0 auto;padding-bottom:40px}
.f{display:flex;align-items:center;padding:6px 14px;border-bottom:1px solid var(--line);min-height:50px}
.f label{width:84px;color:var(--mut);flex:none}
.f input,.f select{flex:1;background:none;border:0;outline:0;min-width:0;padding:8px 0;color-scheme:light}
.f select option{background:var(--card)}
.f.amt{border-bottom-color:var(--red)}.f.amt input{font-size:20px;font-weight:600}
.hint{padding:10px 14px;color:var(--mut);font-size:13px;min-height:38px}
.acts{display:flex;gap:10px;padding:14px}
.acts button{flex:1;padding:13px;border-radius:9px;background:var(--card)}
.acts .pri{background:var(--red);color:#fff;font-weight:600}.acts .danger{color:var(--red)}
#ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#ov[hidden]{display:none}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes sheetIn{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
#ov:not([hidden]){animation:ovIn .2s ease-out}
#ov:not([hidden]) .sheet{animation:sheetIn .28s cubic-bezier(.2,.8,.2,1)}
.skel{padding:0 20px}
.skel i{display:block;height:60px;margin-top:10px;border-radius:16px;background:linear-gradient(90deg,#eceee9 25%,#f6f7f3 50%,#eceee9 75%);background-size:200% 100%;animation:sk 1.4s linear infinite}
.skel i.h{height:130px;margin-top:0;border-radius:20px}
@media (prefers-reduced-motion:reduce){#ov:not([hidden]),#ov:not([hidden]) .sheet,.skel i{animation:none}}
.sheet{width:100%;max-width:var(--layout-width);background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 10px}.sheet label{display:block;color:var(--mut);font-size:12px;margin-top:10px}
.sheet input,.sheet select{width:100%;margin-top:4px;padding:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
.sheet .btns{display:flex;gap:8px;margin-top:16px}.sheet .btns button{flex:1;padding:12px;border-radius:9px;background:var(--bg)}
.sheet .pri{background:var(--red)!important;color:#fff;font-weight:600}.sheet .danger{color:var(--red)}
.login{padding:90px 24px;text-align:center}.login input{width:100%;padding:13px;margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:9px}
.login button{width:100%;padding:13px;border-radius:9px;background:var(--red);color:#fff;font-weight:600}
.err{color:var(--red);min-height:20px}
#bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);right:auto;width:100%;max-width:var(--layout-width);z-index:3;background:var(--color-bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#bottom-nav .bn-inner{max-width:none;margin:0;display:flex;align-items:center;padding:0 4px}
#bottom-nav .bn-tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--color-neutral);font-size:11px;font-weight:500}
#bottom-nav .bn-tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bottom-nav .bn-tab.active{color:var(--color-primary);font-weight:700}
#bottom-nav .bn-new{flex:none;width:52px;height:52px;margin:-18px 6px 0;border-radius:50%;background:var(--color-primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px #1e5a4355}
#bottom-nav .bn-new svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
#bottom-nav.hidden{display:none}
</style>
</head>
<body>
<div id="splash" aria-label="MIDAS" role="img"><span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect class="sq" width="32" height="32" rx="9" fill="#1e5a43"/><g class="coin"><circle cx="16" cy="16" r="10" fill="#f5b301"/><circle cx="16" cy="16" r="7.6" fill="none" stroke="#c98a0b" stroke-width="1"/><path d="M11.2 21V11l4.8 6 4.8-6v10" fill="none" stroke="#1e5a43" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></svg><span class="word" aria-hidden="true"><span class="l" style="--i:0">M</span><span class="l" style="--i:1">I</span><span class="l" style="--i:2">D</span><span class="l" style="--i:3">A</span><span class="l" style="--i:4">S</span></span></span></div>
<div id="app"></div>
<nav id="bottom-nav" aria-label="Main navigation"><div class="bn-inner">
<button class="bn-tab active" data-tab="ledger"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg><span>Home</span></button>
<button class="bn-tab" data-tab="insights"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg><span>Insights</span></button>
<button class="bn-new" data-a="new-tx" aria-label="New transaction"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="bn-tab" data-tab="accounts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 14.5h2"/></svg><span>Accounts</span></button>
<button class="bn-tab" data-tab="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg><span>More</span></button>
</div></nav>
<div id="fm" hidden></div><div id="ov" hidden></div>
<script src="category-icons.js"></script>
<script src="category-picker.js"></script>
<script src="categories-view.js"></script>
<script type="module">
import { shiftMonth, canGoNext, formatMonthLabel } from '/month-nav.js'
import { fmtRupiah } from '/money.js'
const $ =(s, r = document) => r.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const fmt = n => new Intl.NumberFormat('id-ID').format(n)
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta' }).format(new Date())
const S = { month: today().slice(0, 7), tab: (() => { try { const t = sessionStorage.getItem('tab'); return ['trans', 'stats', 'accts', 'more'].includes(t) ? t : 'trans' } catch { return 'trans' } })(), sub: null, sKind: 'expense', stKind: 'expense', sTab: 'stats', cats: [], groups: [], accts: [], txs: [], rec: [], sum: null }

async function api(method, path, body) {
  const r = await fetch('/api/' + path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
  if (r.status === 401) { showLogin(); throw new Error('auth') }
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j
}
const guard = fn => async (...a) => { try { await fn(...a) } catch (e) { if (e.message !== 'auth') alert('Error: ' + e.message) } }

function showLogin(msg = '') {
  $('#app').innerHTML = `<form class="login"><h2>MIDAS</h2><input type="password" name="pw" placeholder="Password" autocomplete="current-password" autofocus><div class="err">${esc(msg)}</div><button>Masuk</button></form>`
  $('form').onsubmit = async e => {
    e.preventDefault()
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: e.target.pw.value }) })
    if (r.ok) load(); else showLogin(r.status === 429 ? 'Too many attempts, try again later' : 'Wrong password')
  }
}

let loadSeq = 0
async function load() {
  const my = ++loadSeq
  // Jangan pernah menampilkan data bulan lain di bawah bulan yang baru dipilih.
  S.status = 'loading'; S.txs = []
  render()
  try {
    const [sum, cats, groups, txs, rec] = await Promise.all([api('GET', 'summary?month=' + S.month), api('GET', 'categories'), api('GET', 'groups'), api('GET', 'transactions?month=' + S.month), api('GET', 'recurring')])
    if (my !== loadSeq) return
    ;[S.sum, S.cats, S.groups, S.txs, S.rec] = [sum, cats, groups, txs, rec]
    S.accts = S.sum.accounts; S.status = 'ready'; render(); if (S.acctView) openAcct(S.acctView)
  } catch (e) {
    if (my !== loadSeq || e.message === 'auth') return
    S.status = 'error'; S.error = e.message; render()
  }
}

const skeleton = (hero, n = 5) => `<div class="skel" role="status" aria-label="Loading">${hero ? '<i class="h"></i>' : ''}${'<i></i>'.repeat(n)}</div>`
function vState() {
  const bar = S.tab === 'trans' ? spentCard(true) : ''
  const cls = S.tab === 'trans' ? 'tempty' : 'empty'
  if (S.status === 'loading') return skeleton(S.tab === 'trans')
  return bar + `<div class="${cls}" role="alert">Failed to load data${S.error ? ': ' + esc(S.error) : ''}<br><button data-a="retry">Try again</button></div>`
}

const cat = id => S.cats.find(c => c.id === id)
const ico = n => categoryIcon(n, S.cats.find(c => c.name === n)?.icon)
const catName = id => { const c = cat(id); if (!c) return '—'; const p = cat(c.parent_id); return p ? `${p.name} › ${c.name}` : c.name }
const acc = id => S.accts.find(a => a.id === id)?.name ?? '?'
const family = id => { const c = cat(id); return c ? (c.parent_id ?? c.id) : null }
const monthLabel = m => new Date(m + '-01T00:00:00').toLocaleDateString('en-GB', { month: 'short', year: 'numeric' })
const sign = { income: 'in', expense: 'ex', transfer: '' }

function render() {
  const titles = { trans: '', stats: 'Stats', accts: '', more: 'Settings' }
  const body = S.status !== 'ready' ? vState() : ({ trans: vTrans, stats: vStats, accts: vAccts, more: vMore }[S.tab] || vPlaceholder)()
  document.querySelectorAll('#bottom-nav .bn-tab').forEach(b => b.classList.toggle('active', TAB_MAP[b.dataset.tab] === S.tab))
  $('#app').innerHTML = `<header>${titles[S.tab] ?? ''}</header><main>${body}</main>`
}

// bottom-nav tab -> layar (S.tab); layar yang belum ada jatuh ke placeholder
const TAB_MAP = { ledger: 'trans', insights: 'stats', accounts: 'accts', more: 'more' }
const vPlaceholder = () => '<div class="empty">Coming soon</div>'
$('#bottom-nav').onclick = e => {
  if (e.target.closest('.bn-new')) {
    if (!S.sum || S.status !== 'ready') return
    S.previousTab = S.tab; $('#bottom-nav').classList.add('hidden'); txNew(); return
  }
  const b = e.target.closest('.bn-tab'); if (!b || !TAB_MAP[b.dataset.tab]) return
  S.tab = TAB_MAP[b.dataset.tab]; S.sub = null; S.acctView = null
  try { sessionStorage.setItem('tab', S.tab) } catch {}
  if (S.status) render(); else document.querySelectorAll('#bottom-nav .bn-tab').forEach(x => x.classList.toggle('active', x === b))
  if (S.tab === 'accts' && S.status === 'ready') refreshAccts()
}

const monthBar = () => `<div class="mnav"><button data-a="mon" data-v="-1" aria-label="Previous month">‹</button><b>${formatMonthLabel(S.month, 'en-GB')}</b><button data-a="mon" data-v="1" aria-label="Next month"${canGoNext(S.month, today().slice(0, 7)) ? '' : ' disabled'}>›</button></div>`
const sumOf = kind => S.txs.filter(t => t.kind === kind).reduce((s, t) => s + t.amount, 0)

const monthLong = m => new Date(m + '-01T00:00:00').toLocaleDateString('en-GB', { month: 'long' })
function spentCard(pending) {
  const inc = sumOf('income'), exp = sumOf('expense'), net = inc - exp
  const canNext = S.month < today().slice(0, 7)
  return `<div class="scard"><div class="top"><span class="ttl">Net in ${esc(monthLong(S.month))}</span><div class="pn">` +
    `<button data-a="mon" data-v="-1" aria-label="Previous month"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>` +
    `<span>${esc(monthLabel(S.month))}</span>` +
    `<button data-a="mon" data-v="1" aria-label="Next month"${canNext ? '' : ' disabled'}><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div></div>` +
    `<div class="big num"><small>Rp</small>${pending ? '—' : (net < 0 ? '−' : '') + fmt(Math.abs(net))}</div>` +
    `<div class="two"><div class="inc"><span class="lbl"><i><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></i><em>Income</em></span><b class="num">${pending ? '—' : fmt(inc)}</b></div><div class="exp"><span class="lbl"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></i><em>Expense</em></span><b class="num">${pending ? '—' : fmt(exp)}</b></div></div></div>`
}

function vTrans() {
  let html = spentCard()
  if (!S.txs.length) return html + `<div class="tempty">No transactions in ${esc(monthLabel(S.month))}.</div>`
  let last = '', open = false
  for (const t of S.txs) {
    if (t.date !== last) {
      if (open) html += '</div></div>'
      last = t.date; open = true; const day = S.txs.filter(x => x.date === t.date)
      const net = day.reduce((s, x) => s + (x.kind === 'income' ? x.amount : x.kind === 'expense' ? -x.amount : 0), 0)
      html += `<div class="dayw"><div class="day"><span>${new Date(t.date + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', weekday: 'short' })}</span><span class="num">${net < 0 ? '−' : ''}${fmt(Math.abs(net))}</span></div><div class="dcard">`
    }
    const c = cat(t.category_id), parent = cat(c?.parent_id)
    const top = t.kind === 'transfer' ? 'Transfer' : (parent?.name ?? c?.name ?? '—')
    const sub = t.kind === 'transfer' || !parent ? '' : c.name
    const acct = t.kind === 'transfer' ? `${esc(acc(t.account_id))} → ${esc(acc(t.to_account_id))}` : esc(acc(t.account_id))
    const mark = t.flag === 'review' ? '<span class="badge r">Review</span>' : t.source === 'auto' ? '<span class="badge">Auto</span>' : ''
    html += `<div class="row"><div class="ico" aria-hidden="true">${ico(top)}</div><div class="n"><span>${esc(sub || top)}</span><small>${sub ? `<i>${esc(top)}</i>` : ''}${mark}</small></div><div class="amt"><b class="${sign[t.kind]}">${fmt(t.amount)}</b><small>${acct}</small></div></div>`
  }
  if (open) html += '</div></div>'
  return html
}

const ST_COLORS = ['#1e5a43', '#f5b301', '#3b82f6', '#e11d48', '#8b5cf6', '#14b8a6', '#f97316', '#64748b']
function vStats() {
  const pill = (a, v, l) => `<button data-a="${a}" data-v="${v}" class="${(a === 'sTab' ? S.sTab : S.stKind) === v ? 'on' : ''}">${l}</button>`
  const head = `<div class="st"><div class="st-pill">${pill('sTab', 'stats', 'Stats')}${pill('sTab', 'budget', 'Budget')}</div>` + monthBar()
  // Budget: placeholder saja (isi dikerjakan di tiket terpisah); S.month dibagikan antar tab
  if (S.sTab === 'budget') return head + '<div class="empty">Budget coming soon</div></div>'
  return head + vStatsBody() + '</div>'
}

function vStatsBody() {
  const kind = S.stKind
  const by = new Map(); let total = 0
  for (const t of S.txs.filter(t => t.kind === kind)) { const k = family(t.category_id); by.set(k, (by.get(k) ?? 0) + t.amount); total += t.amount }
  const toggle = `<div class="st-pill" style="margin-top:8px"><button data-a="stKind" data-v="expense" class="${kind === 'expense' ? 'on' : ''}">Expenses</button><button data-a="stKind" data-v="income" class="${kind === 'income' ? 'on' : ''}">Income</button></div>`
  if (!by.size) return toggle + `<div class="st-card empty" style="padding:40px 20px">No ${kind === 'expense' ? 'expenses' : 'income'} this month.</div>`
  const rows = [...by].map(([k, v]) => [cat(k)?.name ?? 'Uncategorized', v]).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
  const R = 54, C = 2 * Math.PI * R; let off = 0
  const arcs = rows.map(([, v], i) => {
    const len = v / total * C
    const a = `<circle cx="66" cy="66" r="${R}" stroke="${ST_COLORS[i % ST_COLORS.length]}" stroke-dasharray="${Math.max(len - 2, 0.5)} ${C}" stroke-dashoffset="${-off}" stroke-linecap="round"/>`
    off += len; return a
  }).join('')
  const days = new Date(+S.month.slice(0, 4), +S.month.slice(5), 0).getDate()
  const hero = `<div class="st-card"><div class="st-hero"><div class="st-donut"><svg viewBox="0 0 132 132"><circle class="trk" cx="66" cy="66" r="${R}"/>${arcs}</svg><div class="ctr"><span>${rows.length} categories</span><b>${Math.round(rows[0][1] / total * 100)}%</b></div></div>` +
    `<div class="st-meta"><small>Total ${kind === 'expense' ? 'expenses' : 'income'}</small><div class="tot num"><small>Rp</small>${fmt(total)}</div><span class="st-chip">≈ ${fmt(Math.round(total / days))} / day</span></div></div></div>`
  const list = `<div class="st-card" style="padding:8px 20px">` + rows.map(([name, v], i) => {
    const col = ST_COLORS[i % ST_COLORS.length], pc = v / total * 100
    return `<div class="st-row" style="color:${col}"><div class="ic" style="background:${col}1f" aria-hidden="true">${ico(name)}</div><div style="min-width:0"><div class="nm" style="color:var(--txt)">${esc(name)}</div><div class="bar"><i style="width:${pc}%"></i></div></div><div class="am"><b style="color:var(--txt)" class="num">${fmt(v)}</b><small>${Math.round(pc)}%</small></div></div>`
  }).join('') + '</div>'
  return toggle + hero + list
}

function vAcctDetail() {
  const a = acc2(S.acctView); if (!a) { S.acctView = null; return vAccts() }
  const liab = a.type === 'liability'
  let list
  if (S.acctTxs === null) list = skeleton(false, 4)
  else if (!S.acctTxs.length) list = '<div class="tempty" style="margin:16px 0">No transactions in this account yet.</div>'
  else {
    list = '<div class="dcard" style="margin-top:12px">' + S.acctTxs.map(t => {
      const c = cat(t.category_id), parent = cat(c?.parent_id)
      const top = t.kind === 'transfer' ? 'Transfer' : (parent?.name ?? c?.name ?? '—')
      const sub = t.kind === 'transfer' || !parent ? '' : c.name
      const out = t.kind === 'expense' || (t.kind === 'transfer' && t.account_id === a.id)
      const other = t.kind === 'transfer' ? (t.account_id === a.id ? '→ ' + acc(t.to_account_id) : '← ' + acc(t.account_id)) : ''
      return `<div class="row" role="button" tabindex="0" data-a="edit" data-id="${t.id}"><div class="ico" aria-hidden="true">${ico(top)}</div><div class="n"><span>${esc(sub || top)}</span><small>${esc(other || t.note || '')}</small></div><div class="amt"><b class="${out ? 'ex' : 'in'}">${out ? '−' : '+'}${fmt(t.amount)}</b><small>${esc(t.date)}</small></div></div>`
    }).join('') + '</div>'
  }
  return `<section class="accts-v2" aria-label="${esc(a.name)}"><div class="v2-head"><button class="back" data-a="acctBack" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></button><h1 class="ttl">${esc(a.name)}</h1><button class="add" data-a="accEditD" data-id="${a.id}">Edit</button></div><div class="acct-item${liab ? ' liab' : ''}" style="margin-top:4px"><span class="acct-name">Saldo</span><b class="num acct-bal ${a.balance < 0 ? 'ex' : ''}">${fmtRupiah(a.balance)}</b></div>${list}</section>`
}
const acc2 = id => S.accts.find(a => a.id === id)
async function openAcct(id) {
  S.acctView = id; S.acctTxs = null; render()
  try { const r = await api('GET', 'transactions?account=' + id); if (S.acctView === id) { S.acctTxs = r; render() } } catch (e) { if (e.message !== 'auth') { S.acctTxs = []; render() } }
}

function vAccts() {
  if (S.acctView) return vAcctDetail()
  let list
  if (S.acctsErr) list = `<div class="empty" role="alert">Failed to load accounts<br><button data-a="acctsRetry">Try again</button></div>`
  else if (!S.accts.length) list = '<div class="empty">No accounts yet.</div>'
  else {
    const t = S.sum?.totals
    const rp = n => (n < 0 ? '−' : '') + 'Rp ' + fmt(Math.abs(Math.round(n)))
    const BRAND = { bca: '#0060af', gopay: '#00aed6', ovo: '#4c2a86', dana: '#118eea', shopeepay: '#ee4d2d', jago: '#f7a600', bsi: '#00a39d', mandiri: '#003d79', bri: '#00529c', bni: '#f15a22', jenius: '#00a7e1', linkaja: '#e82529' }
    const brand = n => BRAND[Object.keys(BRAND).find(k => n.toLowerCase().replace(/\s/g, '').includes(k))]
    const AV = ['#1e5a43', '#3b82f6', '#8b5cf6', '#f97316', '#14b8a6', '#e11d48', '#c98a0b']
    list = t ? `<div class="ac-hero"><small>Net Worth</small><div class="nw num"><small>${t.total < 0 ? '−' : ''}Rp</small>${fmt(Math.abs(Math.round(t.total)))}</div><div class="two"><div class="a"><span class="lbl"><i><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></i><em>Assets</em></span><b class="num">${fmt(Math.round(t.assets))}</b></div><div class="l"><span class="lbl"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg></i><em>Liabilities</em></span><b class="num">${fmt(Math.round(t.liabilities))}</b></div></div></div>` : ''
    for (const g of [...S.groups, { id: null, name: 'Other', type: 'asset' }].sort((a, b) => (b.type === 'liability') - (a.type === 'liability'))) {
      const items = S.accts.filter(a => (a.group_id ?? null) === g.id); if (!items.length) continue
      const liab = g.type === 'liability', gs = items.reduce((n, a) => n + a.balance, 0)
      list += `<div class="ac-gh${liab ? ' liab' : ''}"><span>${esc(g.name)}${liab ? ' · Liability' : ''}</span><b class="num">${rp(gs)}</b></div><div class="ac-card">` +
        items.map((a, i) => { const col = liab ? '#c0392b' : brand(a.name) || AV[(a.id ?? i) % AV.length]; const slug = a.name.toLowerCase().replace(/[^a-z0-9]/g, ''); return `<div class="ac-row" role="button" tabindex="0" data-a="acctOpen" data-id="${a.id}"><div class="ac-av" style="background:${col}1f;color:${col};overflow:hidden">${esc(a.name.slice(0, 2).toUpperCase())}<img src="logos/${slug}.svg" alt="" style="position:absolute;width:40px;height:40px;object-fit:contain;background:#fff" onerror="this.remove()"></div><span class="ac-nm">${esc(a.name)}</span><b class="num ac-bal ${a.balance < 0 ? 'ex' : ''}">${rp(a.balance)}</b></div>` }).join('') + '</div>'
    }
  }
  return `<section class="ac" aria-label="Accounts"><div class="ac-top"><h1>Accounts</h1><button data-a="accAdd" aria-label="Add account"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Account</button></div><div id="accts-list">${list}</div></section>`
}

// Ambil ulang data akun dari GET /api/summary setiap layar Accounts dibuka (tanpa cache)
let acctsSeq = 0
async function refreshAccts() {
  const my = ++acctsSeq
  try {
    const sum = await api('GET', 'summary?month=' + S.month)
    if (my !== acctsSeq) return
    S.sum = sum; S.accts = sum.accounts; S.acctsErr = false
  } catch (e) {
    if (my !== acctsSeq || e.message === 'auth') return
    S.acctsErr = true
  }
  if (S.tab === 'accts' && S.status === 'ready') render()
}
document.addEventListener('click', e => { if (e.target.closest('[data-a="acctsRetry"]')) refreshAccts() })

function vAcctsLegacy() {
  const t = S.sum.totals
  let html = `<div class="sum"><div>Assets<b class="num in">${fmt(t.assets)}</b></div><div>Liabilities<b class="num ex">${fmt(t.liabilities)}</b></div><div>Net Worth<b class="num ${t.total < 0 ? 'ex' : ''}">${fmt(t.total)}</b></div></div>`
  const groups = [...S.groups, { id: null, name: 'Other', type: 'asset' }]
  for (const g of groups) {
    const list = S.accts.filter(a => (a.group_id ?? null) === g.id); if (!list.length) continue
    const gs = list.reduce((s, a) => s + a.balance, 0)
    html += `<div class="grp"><span>${esc(g.name)} · ${g.type === 'asset' ? 'Asset' : 'Liability'}</span><span class="num ${gs < 0 ? 'ex' : 'in'}">${fmt(gs)}</span></div>` +
      list.map(a => `<div class="row"><div class="n">${esc(a.name)}</div><div class="num ${a.balance < 0 ? 'ex' : 'in'}">${fmt(a.balance)}</div></div>`).join('')
  }

// Add/edit a category (c = existing) or a sub-category (parent = category id; s = existing sub).
function catSheet({ title, kind, c, parent, s }) {
  const o = $('#ov'), target = s ?? c, isSub = parent != null || !!s
  const showBudget = !isSub && (c?.kind ?? kind) === 'expense'
  const subsHtml = c ? `<div class="sec"><span>Sub-categories</span><button data-r="sa">+ Sub</button></div>` +
    S.cats.filter(x => x.parent_id === c.id).map(x => `<div class="row"><div class="n">${esc(x.name)}</div><button data-r="se" data-id="${x.id}">Edit</button><button data-r="sd" data-id="${x.id}" class="danger">Delete</button></div>`).join('') : ''
  o.innerHTML = `<div class="sheet"><h3>${esc(title)}</h3>
    <label>Name<input name="name" value="${esc(target?.name ?? '')}" autocomplete="off" aria-describedby="cerr"></label>
    ${isSub ? '' : `<label>Icon<select name="icon">${Object.entries(ICON_CHOICES).map(([k, [l]]) => `<option value="${k}"${(c?.icon || 'tag') === k ? ' selected' : ''}>${l}</option>`).join('')}</select></label>`}
    ${showBudget ? `<label>Monthly budget (Rp)<input name="budget" type="number" inputmode="numeric" value="${esc(c?.monthly_budget ?? 0)}"></label>` : ''}
    <div class="err" id="cerr" role="alert"></div>${subsHtml}
    <div class="btns"><button data-r="x">Cancel</button>${target ? '<button data-r="d" class="danger">Delete</button>' : ''}<button data-r="s" class="pri">Save</button></div></div>`
  o.hidden = false
  const err = m => { $('#cerr', o).textContent = m; $('[name=name]', o).setAttribute('aria-invalid', 'true') }
  const reopen = async id => { await load(); const n = cat(id); n ? catSheet({ title: 'Edit category', c: n }) : (o.hidden = true) }
  o.onclick = async e => {
    const b = e.target.closest('[data-r]'); if (!b && e.target !== o) return
    const r = b?.dataset.r
    if (!r || r === 'x') { o.hidden = true; return }
    try {
      if (r === 'sa') { o.hidden = true; return catSheet({ title: 'New sub-category', parent: c.id }) }
      if (r === 'se') { const x = cat(+b.dataset.id); return catSheet({ title: 'Edit sub-category', parent: c.id, s: x }) }
      if (r === 'sd') {
        const x = cat(+b.dataset.id)
        if (!confirm(`Delete sub-category "${x.name}"?\nTransactions using it are kept and moved to Uncategorized / Other.`)) return
        await api('DELETE', 'categories/' + x.id); return reopen(c.id)
      }
      if (r === 'd') {
        const what = isSub ? 'sub-category' : 'category'
        if (!confirm(`Delete ${what} "${target.name}"?\nTransactions using it are kept and moved to Uncategorized / Other (budgets and account balances are recalculated).`)) return
        await api('DELETE', 'categories/' + target.id); o.hidden = true
        return isSub ? reopen(parent) : load()
      }
      if (r === 's') {
        const name = $('[name=name]', o).value.trim()
        if (!name) return err('Name is required')
        const bv = $('[name=budget]', o)?.value
        const monthly_budget = bv === undefined || bv === '' ? undefined : Math.round(Number(bv))
        const icon = $('[name=icon]', o)?.value
        if (target) await api('PUT', 'categories/' + target.id, { name, icon, monthly_budget })
        else await api('POST', 'categories', { name, icon, kind: isSub ? undefined : kind, parent_id: isSub ? parent : null, monthly_budget })
        o.hidden = true
        return isSub ? reopen(parent) : load()
      }
    } catch (x) { if (x.message !== 'auth') err(x.message) }
  }
  setTimeout(() => $('[name=name]', o)?.focus(), 0)
}

const GROUP_TYPES = [['asset', 'Asset'], ['liability', 'Liability']] // hanya dua tipe
const grpMsg = m => /FOREIGN KEY/i.test(m) ? 'This group still has accounts and cannot be deleted.' : /UNIQUE/i.test(m) ? 'Group name already in use.' : /CHECK/i.test(m) ? 'Type must be asset or liability.' : /NOT NULL/i.test(m) ? 'Name is required' : m

const nfValidDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); if (!m) return false; const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])); return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3] }
function nfValidate(f) {
  const e = {}
  if (!(Number(f.amount) > 0)) e.amount = NF_MSG.amount
  if (!String(f.date).trim()) e.date = NF_MSG.dateEmpty; else if (!nfValidDate(f.date)) e.date = NF_MSG.dateInvalid

      </div>
      ${sec(tr ? 'From account' : 'Account', accts('account', S.accts) + err('account'))}
      ${tr ? sec('To account', accts('to', S.accts) + err('to')) : ''}
      ${tr ? '' : catHtml}
      <div style="display:flex;flex-direction:column;gap:8px;padding:24px 20px 0">
        ${failed ? `<div role="alert" style="color:#c0392b;font-size:13px;text-align:center">${esc(NF_MSG.failed)}</div>` : ''}
        <button data-nf="save" ${saving ? 'disabled' : ''} style="height:56px;border-radius:999px;background:${G};color:#fff;font-size:15px;font-weight:700">Save ${NF_TYPE_LABEL[f.type]}</button>
        <button data-nf="cancel" style="height:48px;border-radius:999px;color:${MUTED};font-size:14px;font-weight:600">Cancel</button>
      </div></div>`
    fm.hidden = false
  }
  fm.oninput = e => {
    const n = e.target.name
    if (n === 'amount') { f.amount = e.target.value.replace(/\D/g, '').slice(0, 13); e.target.value = f.amount ? fmt(f.amount) : '' }
    else if (n === 'date') f.date = e.target.value
  }
  fm.onclick = async e => {
    const b = e.target.closest('[data-nf]'); if (!b) return
    const k = b.dataset.nf, v = b.dataset.v
    if (k === 'cancel') return close()
    if (k === 'type') { if (f.type !== v) { f.type = v; f.cat = f.sub = null; errs = {}; failed = false; draw() } return }
    if (k === 'cat') { Object.assign(f, CategoryPicker.selectCategory(f, +v)); delete errs.cat; return draw() }
    if (k === 'sub') { Object.assign(f, CategoryPicker.selectSub(f, +v, S.cats)); return draw() }
    if (k === 'account' || k === 'to') { f[k] = +v; delete errs[k]; delete errs.to; return draw() }
    if (k === 'save') {
      if (saving) return
      errs = nfValidate(f); failed = false
      if (Object.keys(errs).length) return draw()
      saving = true; b.disabled = true
      try {
        await api('POST', 'transactions', { date: f.date, kind: f.type, amount: Number(f.amount), account_id: f.account, to_account_id: f.type === 'transfer' ? f.to : null, category_id: f.type === 'transfer' ? null : (f.sub || f.cat), note: '' })
      } catch (x) { saving = false; if (x.message === 'auth') return; failed = true; return draw() }
      S.month = f.date.slice(0, 7) < today().slice(0, 7) ? f.date.slice(0, 7) : today().slice(0, 7); S.tab = 'trans'; S.previousTab = null
      close(); load()
    }
  }
  document.onkeydown = e => { if (e.key === 'Escape' && !fm.hidden) close() }
  draw()
}

// ---------- transaction form (edit) ----------
function txForm(t) {
  const f = t ? { ...t, _o: t } : { kind: 'expense', date: today(), amount: '', account_id: S.accts[0]?.id ?? null, to_account_id: null, category_id: null, note: '' }
  const fm = $('#fm'), close = () => {
    fm.hidden = true; fm.innerHTML = ''
    document.onkeydown = null
    $('#bottom-nav').classList.remove('hidden')
    if (S.previousTab) { S.tab = S.previousTab; S.previousTab = null; render() }
  }
  const catOpts = () => {
    const kind = f.kind === 'income' ? 'income' : 'expense'
    return '<option value="">—</option>' + S.cats.filter(c => c.kind === kind && !c.parent_id).map(p =>
      `<option value="${p.id}"${f.category_id === p.id ? ' selected' : ''}>${esc(p.name)}</option>` +
      S.cats.filter(c => c.parent_id === p.id).map(c => `<option value="${c.id}"${f.category_id === c.id ? ' selected' : ''}>${esc(p.name)} › ${esc(c.name)}</option>`).join('')).join('')
  }
  const accOpts = sel => S.accts.map(a => `<option value="${a.id}"${sel === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')
  const hint = () => {
    if (f.kind !== 'expense' || !f.category_id || String(f.date).slice(0, 7) !== S.month) return ''
    const b = S.sum.budgets.find(x => x.categoryId === family(f.category_id)); if (!b || !b.budget) return ''
    let rem = b.remaining; const o = f._o
    if (o && o.kind === 'expense' && o.date.slice(0, 7) === S.month && family(o.category_id) === b.categoryId) rem += o.amount
    return `Sisa budget ${esc(b.name)}: ${fmt(rem)} → <b class="${rem - (+f.amount || 0) < 0 ? 'ex' : ''}">${fmt(rem - (+f.amount || 0))}</b>`
  }
  const draw = () => {
    fm.innerHTML = `<div class="in-wrap"><header style="display:flex;align-items:center;gap:8px"><button data-r="x" aria-label="Back" style="background:none;border:0;padding:4px 8px 4px 0;font-size:22px;line-height:1;color:inherit;cursor:pointer">←</button>${t ? 'Edit' : 'New transaction'}</header>
      <div class="seg">${['income', 'expense', 'transfer'].map(k => `<button data-k="${k}" class="${f.kind === k ? 'on' : ''}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>
      <div class="f"><label>Date</label><input type="date" name="date" value="${esc(f.date)}"></div>
      <div class="f amt"><label>Amount</label><input name="amount" inputmode="numeric" placeholder="0" value="${f.amount ? fmt(f.amount) : ''}"></div>
      ${f.kind === 'transfer' ? '' : `<div class="f"><label>Category</label><select name="category_id">${catOpts()}</select></div>`}
      <div class="f"><label>${f.kind === 'transfer' ? 'From' : 'Account'}</label><select name="account_id">${accOpts(f.account_id)}</select></div>
      ${f.kind === 'transfer' ? `<div class="f"><label>To</label><select name="to_account_id">${accOpts(f.to_account_id ?? S.accts.find(a => a.id !== f.account_id)?.id)}</select></div>` : ''}
      <div class="f"><label>Note</label><input name="note" value="${esc(f.note)}"></div>
      <div class="hint" id="hint">${hint()}</div>
      <div class="acts"><button data-r="x">Cancel</button>${t ? '<button data-r="d" class="danger">Delete</button>' : ''}<button data-r="s" class="pri">Save</button></div></div>`
    fm.hidden = false
  }
  fm.oninput = fm.onchange = e => {
    const n = e.target.name; if (!n) return
    if (n === 'amount') { f.amount = Number(e.target.value.replace(/\D/g, '')); e.target.value = f.amount ? fmt(f.amount) : '' }
    else f[n] = ['category_id', 'account_id', 'to_account_id'].includes(n) ? (e.target.value ? Number(e.target.value) : null) : e.target.value
    $('#hint').innerHTML = hint()
  }
  fm.onclick = guard(async e => {
    const b = e.target.closest('button'); if (!b) return
    if (b.dataset.k) { f.kind = b.dataset.k; if (f.kind !== 'transfer') f.to_account_id = null; else f.category_id = null; if (f.category_id && cat(f.category_id)?.kind !== (f.kind === 'income' ? 'income' : 'expense')) f.category_id = null; return draw() }
    if (b.dataset.r === 'x') return close()
    if (b.dataset.r === 'd') { if (!confirm('Delete this transaction?')) return; await api('DELETE', 'transactions/' + t.id); close(); return load() }
    if (b.dataset.r === 's') {
      const p = { date: f.date, kind: f.kind, amount: f.amount, account_id: f.account_id, to_account_id: f.kind === 'transfer' ? (f.to_account_id ?? fm.querySelector('[name=to_account_id]').value | 0) : null, category_id: f.kind === 'transfer' ? null : f.category_id, note: f.note ?? '' }
      if (t) { await api('PUT', 'transactions/' + t.id, { ...p, flag: null }) } else await api('POST', 'transactions', p)
      close(); load()
    }
  })
  document.onkeydown = e => { if (e.key === 'Escape' && !fm.hidden) close() }
  draw()
}

// ---------- actions ----------
const A = {
  tab: d => { S.tab = d.v; S.sub = null; render() },
  retry: () => load(),
  mon: d => { if (+d.v > 0 && !canGoNext(S.month, today().slice(0, 7))) return; S.month = shiftMonth(S.month, +d.v); load() },
  add: () => { S.previousTab = S.tab; $('#bottom-nav').classList.add('hidden'); txNew() },
  edit: d => txForm(S.txs.find(t => t.id === +d.id) ?? S.acctTxs?.find(t => t.id === +d.id)),
  sTab: d => { S.sTab = d.v; render() }, sKind: d => { S.sKind = d.v; render() }, stKind: d => { S.stKind = d.v; render() },
  sub: d => { S.sub = d.v; history.pushState({ sub: d.v }, ''); render(); if (d.v === 'groups') refreshGroups(); if (d.v === 'recurring') refreshRecurring() },
  back: () => { if (history.state?.sub) history.back(); else { S.sub = null; render() } },
  logout: async () => { document.cookie = 'midas=; Max-Age=0; Path=/'; showLogin() },
  catAdd: d => catSheet({ title: 'New category', kind: d.kind }),
  catEdit: d => catSheet({ title: 'Edit category', c: cat(+d.id) }),
  grpAdd: () => groupSheet(null),
  grpEdit: d => groupSheet(S.groups.find(x => x.id === +d.id)),
  accAdd: async () => A._acc(null),
  acctOpen: d => openAcct(+d.id),
  acctBack: () => { S.acctView = null; render() },
  accEditD: d => A._acc(S.accts.find(a => a.id === +d.id)),
  accEdit: d => A._acc(S.accts.find(a => a.id === +d.id)),
  _acc: async a => {
    const r = await ask(a ? 'Edit account' : 'New account', [{ k: 'name', label: 'Name', value: a?.name }, { k: 'group_id', label: 'Group', num: true, value: a?.group_id, options: S.groups.map(g => [g.id, `${g.name} (${g.type})`]) }, { k: 'opening_balance', label: 'Opening balance (Rp, negative for debt)', type: 'number', value: a?.opening_balance ?? 0 }], !!a)
    if (!confirmDel(r)) return
    if (r._del) return (await api('DELETE', 'accounts/' + a.id), load())
    if (!r.name) return
    r.type = S.groups.find(g => g.id === r.group_id)?.type ?? 'asset'
    if (a) await api('PUT', 'accounts/' + a.id, r); else await api('POST', 'accounts', r)
    load()
  },
  recAdd: () => recSheet(null), recEdit: d => recSheet(S.rec.find(r => r.id === +d.id)),
}
$('#app').onclick = e => { const t = e.target.closest('[data-a]'); if (t) guard(A[t.dataset.a])(t.dataset) }
window.addEventListener('popstate', () => { if (S.sub) { S.sub = null; S.tab = 'more'; render() } })
setTimeout(() => { const sp = $('#splash'); sp.classList.add('out'); setTimeout(() => sp.remove(), 400) }, 1300)
load()
</script>
</body>
</html>
