<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#222429">
<title>MIDAS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23222429'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23f5b301'/%3E%3Ctext x='16' y='20.5' font-size='12' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23222429'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#222429;--card:#2a2c32;--line:#33363c;--txt:#e8e8ea;--mut:#8b8f98;--red:#ff6150;--blue:#4a90e2;--amb:#f5a623}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 14px 8px;text-align:center;font-weight:600;font-size:17px;position:sticky;top:0;background:var(--bg);z-index:2}
main{flex:1;padding-bottom:90px}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
.in{color:var(--blue)}.ex{color:var(--red)}.mut{color:var(--mut)}
.mnav{display:flex;justify-content:space-between;align-items:center;padding:4px 14px 8px}
.mnav button{font-size:22px;padding:2px 14px}
.sum{display:flex;justify-content:space-around;padding:10px 0;border-block:1px solid var(--line);text-align:center;color:var(--mut);font-size:12px}
.sum b{display:block;font-size:14px;margin-top:3px}
.day{background:var(--card);padding:6px 14px;display:flex;justify-content:space-between;color:var(--mut);font-size:12px}
.row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #2e3036;width:100%;text-align:left}
.row .c{width:96px;color:var(--mut);font-size:12px;flex:none}
.row .n{flex:1;min-width:0}.row .n small{display:block;color:var(--mut);font-size:11px}
.row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.badge{background:#ff615033;color:#ff9a8d;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:4px}
.badge.r{background:#f5a62333;color:var(--amb)}
.fab{position:fixed;right:max(14px,calc(50% - 226px));bottom:calc(70px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--red);font-size:30px;color:#fff;box-shadow:0 4px 14px #0008;z-index:3}
nav{position:fixed;bottom:0;left:0;right:0;z-index:3;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:480px;margin:0 auto;display:flex}
nav button{flex:1;padding:9px 0 8px;color:var(--mut);font-size:11px}
nav button.on{color:var(--red)}nav button i{display:block;font-style:normal;font-size:19px}
.seg{display:flex;gap:8px;padding:8px 14px}
.seg button{flex:1;border:1px solid #3a3d44;border-radius:7px;padding:8px 0;color:var(--mut)}
.seg button.on{border-color:var(--red);color:var(--red)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:10px 0;color:var(--mut)}.tabs button.on{color:var(--txt);border-bottom:2px solid var(--red)}
.grp{background:var(--card);padding:7px 14px;display:flex;justify-content:space-between;color:var(--mut);font-size:13px}
.bar{height:6px;border-radius:3px;background:#3a3d44;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.bar i.w{background:var(--amb)}.bar i.d{background:var(--red)}
.bud{padding:11px 14px;border-bottom:1px solid #2e3036}.bud>div:first-child{display:flex;justify-content:space-between}
.empty{text-align:center;color:var(--mut);padding:60px 20px}
.sec{padding:9px 14px;background:#1c1e22;color:var(--mut);font-size:12px;display:flex;justify-content:space-between}
.sec button{color:var(--red)}
.sub{padding-left:32px;color:#c3c5ca}
.mi{display:flex;justify-content:space-between;width:100%;padding:14px;border-bottom:1px solid #2e3036;text-align:left}
#fm{position:fixed;inset:0;background:var(--bg);z-index:10;overflow:auto}
#fm .in-wrap{max-width:480px;margin:0 auto;padding-bottom:40px}
.f{display:flex;align-items:center;padding:6px 14px;border-bottom:1px solid var(--line);min-height:50px}
.f label{width:84px;color:var(--mut);flex:none}
.f input,.f select{flex:1;background:none;border:0;outline:0;min-width:0;padding:8px 0;color-scheme:dark}
.f select option{background:#2a2c32}
.f.amt{border-bottom-color:var(--red)}.f.amt input{font-size:20px;font-weight:600}
.hint{padding:10px 14px;color:var(--mut);font-size:13px;min-height:38px}
.acts{display:flex;gap:10px;padding:14px}
.acts button{flex:1;padding:13px;border-radius:9px;background:var(--card)}
.acts .pri{background:var(--red);color:#fff;font-weight:600}.acts .danger{color:var(--red)}
#ov{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
#ov[hidden]{display:none}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 10px}.sheet label{display:block;color:var(--mut);font-size:12px;margin-top:10px}
.sheet input,.sheet select{width:100%;margin-top:4px;padding:11px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt)}
.sheet .btns{display:flex;gap:8px;margin-top:16px}.sheet .btns button{flex:1;padding:12px;border-radius:9px;background:var(--bg)}
.sheet .pri{background:var(--red)!important;color:#fff;font-weight:600}.sheet .danger{color:var(--red)}
.login{padding:90px 24px;text-align:center}.login input{width:100%;padding:13px;margin:14px 0;background:var(--card);border:1px solid var(--line);border-radius:9px}
.login button{width:100%;padding:13px;border-radius:9px;background:var(--red);color:#fff;font-weight:600}
.err{color:var(--red);min-height:20px}
</style>
</head>
<body>
<div id="app"></div><div id="fm" hidden></div><div id="ov" hidden></div>
<script>
const $ = (s, r = document) => r.querySelector(s)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const fmt = n => new Intl.NumberFormat('id-ID').format(n)
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta' }).format(new Date())
const S = { month: today().slice(0, 7), tab: 'trans', sub: null, sKind: 'expense', sTab: 'stats', cats: [], groups: [], accts: [], txs: [], rec: [], sum: null }

async function api(method, path, body) {
  const r = await fetch('/api/' + path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
  if (r.status === 401) { showLogin(); throw new Error('auth') }
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j
}
const guard = fn => async (...a) => { try { await fn(...a) } catch (e) { if (e.message !== 'auth') alert('Gagal: ' + e.message) } }

function showLogin(msg = '') {
  $('#app').innerHTML = `<form class="login"><h2>MIDAS</h2><input type="password" name="pw" placeholder="Password" autocomplete="current-password" autofocus><div class="err">${esc(msg)}</div><button>Masuk</button></form>`
  $('form').onsubmit = async e => {
    e.preventDefault()
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ password: e.target.pw.value }) })
    if (r.ok) load(); else showLogin(r.status === 429 ? 'Terlalu banyak percobaan, coba lagi nanti' : 'Password salah')
  }
}

const load = guard(async () => {
  ;[S.sum, S.cats, S.groups, S.txs, S.rec] = await Promise.all([api('GET', 'summary?month=' + S.month), api('GET', 'categories'), api('GET', 'groups'), api('GET', 'transactions?month=' + S.month), api('GET', 'recurring')])
  S.accts = S.sum.accounts; render()
})

const cat = id => S.cats.find(c => c.id === id)
const catName = id => { const c = cat(id); if (!c) return '—'; const p = cat(c.parent_id); return p ? `${p.name} › ${c.name}` : c.name }
const acc = id => S.accts.find(a => a.id === id)?.name ?? '?'
const family = id => { const c = cat(id); return c ? (c.parent_id ?? c.id) : null }
const monthLabel = m => new Date(m + '-01T00:00:00').toLocaleDateString('id-ID', { month: 'short', year: 'numeric' })
const shiftMonth = (m, d) => { const [y, mo] = m.split('-').map(Number), t = new Date(y, mo - 1 + d, 1); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}` }
const sign = { income: 'in', expense: 'ex', transfer: '' }

function render() {
  const titles = { trans: 'Trans.', stats: 'Stats', accts: 'Accounts', more: 'Settings' }
  const body = { trans: vTrans, stats: vStats, accts: vAccts, more: vMore }[S.tab]()
  const nav = [['trans', '📒', 'Trans.'], ['stats', '📊', 'Stats'], ['accts', '🪙', 'Accounts'], ['more', '⋯', 'More']]
    .map(([k, i, l]) => `<button data-a="tab" data-v="${k}" class="${S.tab === k ? 'on' : ''}"><i>${i}</i>${l}</button>`).join('')
  $('#app').innerHTML = `<header>${titles[S.tab]}</header><main>${body}</main>${S.tab === 'trans' ? '<button class="fab" data-a="add" aria-label="Tambah">+</button>' : ''}<nav><div>${nav}</div></nav>`
}

const monthBar = () => `<div class="mnav"><button data-a="mon" data-v="-1" aria-label="Bulan lalu">‹</button><b>${monthLabel(S.month)}</b><button data-a="mon" data-v="1" aria-label="Bulan depan">›</button></div>`
const sumOf = kind => S.txs.filter(t => t.kind === kind).reduce((s, t) => s + t.amount, 0)

function vTrans() {
  const inc = sumOf('income'), exp = sumOf('expense')
  let html = monthBar() + `<div class="sum"><div>Income<b class="in">${fmt(inc)}</b></div><div>Exp.<b class="ex">${fmt(exp)}</b></div><div>Total<b>${fmt(inc - exp)}</b></div></div>`
  if (!S.txs.length) return html + '<div class="empty">Belum ada transaksi bulan ini</div>'
  let last = ''
  for (const t of S.txs) {
    if (t.date !== last) {
      last = t.date; const day = S.txs.filter(x => x.date === t.date)
      const net = day.reduce((s, x) => s + (x.kind === 'income' ? x.amount : x.kind === 'expense' ? -x.amount : 0), 0)
      html += `<div class="day"><span>${new Date(t.date + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', weekday: 'short' })}</span><span class="${net < 0 ? 'ex' : net > 0 ? 'in' : ''}">${fmt(Math.abs(net))}</span></div>`
    }
    const left = t.kind === 'transfer' ? 'Transfer' : esc(catName(t.category_id))
    const acct = t.kind === 'transfer' ? `${esc(acc(t.account_id))} → ${esc(acc(t.to_account_id))}` : esc(acc(t.account_id))
    html += `<button class="row" data-a="edit" data-id="${t.id}"><div class="c">${left}</div><div class="n"><span>${esc(t.note) || '&nbsp;'}${t.source !== 'manual' ? `<span class="badge" style="display:inline">${t.source === 'auto' ? 'auto' : 'rutin'}</span>` : ''}${t.flag === 'review' ? '<span class="badge r" style="display:inline">cek</span>' : ''}</span><small>${acct}</small></div><div class="${sign[t.kind]}">${fmt(t.amount)}</div></button>`
  }
  return html
}

function vStats() {
  let html = `<div class="seg"><button data-a="sTab" data-v="stats" class="${S.sTab === 'stats' ? 'on' : ''}">Stats</button><button data-a="sTab" data-v="budget" class="${S.sTab === 'budget' ? 'on' : ''}">Budget</button></div>` + monthBar()
  if (S.sTab === 'budget') {
    const b = S.sum.budgets
    return html + (b.length ? b.map(x => {
      const pct = x.budget ? Math.min(100, Math.round(x.used / x.budget * 100)) : 0, cls = x.budget && x.used > x.budget ? 'd' : pct >= 80 ? 'w' : ''
      return `<div class="bud"><div><span>${esc(x.name)}</span><span class="${cls === 'd' ? 'ex' : ''}">${fmt(x.used)} / ${x.budget ? fmt(x.budget) : '—'}</span></div><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div></div>`
    }).join('') : '<div class="empty">Belum ada kategori</div>')
  }
  html += `<div class="tabs"><button data-a="sKind" data-v="income" class="${S.sKind === 'income' ? 'on' : ''}">Income</button><button data-a="sKind" data-v="expense" class="${S.sKind === 'expense' ? 'on' : ''}">Exp.</button></div>`
  const by = new Map(); let total = 0
  for (const t of S.txs.filter(t => t.kind === S.sKind)) { const k = family(t.category_id); by.set(k, (by.get(k) ?? 0) + t.amount); total += t.amount }
  if (!total) return html + '<div class="empty">Belum ada data</div>'
  return html + [...by].sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="bud"><div><span>${esc(cat(k)?.name ?? 'Tanpa kategori')}</span><span>${fmt(v)} · ${Math.round(v / total * 100)}%</span></div><div class="bar"><i class="${S.sKind === 'expense' ? 'd' : ''}" style="width:${v / total * 100}%"></i></div></div>`).join('')
}

function vAccts() {
  const t = S.sum.totals
  let html = `<div class="sum"><div>Assets<b class="in">${fmt(t.assets)}</b></div><div>Liabilities<b class="ex">${fmt(t.liabilities)}</b></div><div>Total<b>${fmt(t.total)}</b></div></div>`
  const groups = [...S.groups, { id: null, name: 'Lainnya', type: 'asset' }]
  for (const g of groups) {
    const list = S.accts.filter(a => (a.group_id ?? null) === g.id); if (!list.length) continue
    const gs = list.reduce((s, a) => s + a.balance, 0)
    html += `<div class="grp"><span>${esc(g.name)} · ${g.type === 'asset' ? 'Asset' : 'Liability'}</span><span class="${gs < 0 ? 'ex' : 'in'}">${fmt(gs)}</span></div>` +
      list.map(a => `<div class="row"><div class="n">${esc(a.name)}</div><div class="${a.balance < 0 ? 'ex' : 'in'}">${fmt(a.balance)}</div></div>`).join('')
  }
  return html + (S.accts.length ? '' : '<div class="empty">Belum ada account — tambah di More › Accounts</div>')
}

function vMore() {
  if (S.sub === 'cats') return `<div class="sec"><button data-a="back">‹ Settings</button><span>Kategori</span></div>` + ['expense', 'income'].map(k =>
    `<div class="sec"><span>${k === 'expense' ? 'Expense' : 'Income'}</span><button data-a="catAdd" data-kind="${k}">+ Kategori</button></div>` +
    S.cats.filter(c => c.kind === k && !c.parent_id).map(p =>
      `<button class="mi" data-a="catEdit" data-id="${p.id}"><span>${esc(p.name)}</span><span class="mut">${p.monthly_budget ? 'Budget ' + fmt(p.monthly_budget) : ''}</span></button>` +
      S.cats.filter(c => c.parent_id === p.id).map(c => `<button class="mi sub" data-a="catEdit" data-id="${c.id}"><span>› ${esc(c.name)}</span></button>`).join('') +
      `<button class="mi sub mut" data-a="catAdd" data-kind="${k}" data-parent="${p.id}">+ Sub kategori</button>`).join('')).join('')
  if (S.sub === 'accts') return `<div class="sec"><button data-a="back">‹ Settings</button><span>Accounts</span></div><div class="sec"><span>Group</span><button data-a="grpAdd">+ Group</button></div>` +
    S.groups.map(g => `<button class="mi" data-a="grpEdit" data-id="${g.id}"><span>${esc(g.name)}</span><span class="mut">${g.type}</span></button>`).join('') +
    `<div class="sec"><span>Account</span><button data-a="accAdd">+ Account</button></div>` +
    S.accts.map(a => `<button class="mi" data-a="accEdit" data-id="${a.id}"><span>${esc(a.name)}</span><span class="mut">${esc(S.groups.find(g => g.id === a.group_id)?.name ?? '')} · ${a.type}</span></button>`).join('')
  if (S.sub === 'rec') return `<div class="sec"><button data-a="back">‹ Settings</button><span>Rutin / Auto debit</span></div><div class="sec"><span>Dibuat otomatis tiap bulan</span><button data-a="recAdd">+ Tambah</button></div>` +
    (S.rec.map(r => `<button class="mi" data-a="recEdit" data-id="${r.id}"><span>${esc(r.note || catName(r.category_id))} <span class="mut">tgl ${r.day_of_month}${r.active ? '' : ' · nonaktif'}</span></span><span class="${sign[r.kind]}">${fmt(r.amount)}</span></button>`).join('') || '<div class="empty">Belum ada</div>')
  const mi = (k, l, d) => `<button class="mi" data-a="sub" data-v="${k}"><span>${l}</span><span class="mut">${d}</span></button>`
  return `<div class="sec"><span>Category / Budget</span></div>${mi('cats', 'Kategori & Budget', 'Category › Sub')}<div class="sec"><span>Accounts</span></div>${mi('accts', 'Accounts & Groups', 'Asset / Liability')}<div class="sec"><span>Auto debit</span></div>${mi('rec', 'Transaksi rutin', 'Cicilan, langganan')}<div class="sec"><span>Akun</span></div><button class="mi" data-a="logout"><span>Keluar</span></button>`
}

// ---------- generic sheet ----------
function ask(title, fields, canDel) {
  return new Promise(resolve => {
    const o = $('#ov')
    o.innerHTML = `<div class="sheet"><h3>${esc(title)}</h3>${fields.map((f, i) => `<label>${esc(f.label)}${f.options
      ? `<select data-i="${i}">${f.options.map(([v, l]) => `<option value="${esc(v)}"${String(v) === String(f.value) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`
      : `<input data-i="${i}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}"${f.type === 'number' ? ' inputmode="numeric"' : ''}>`}</label>`).join('')}
      <div class="btns"><button data-r="x">Batal</button>${canDel ? '<button data-r="d" class="danger">Hapus</button>' : ''}<button data-r="s" class="pri">Simpan</button></div></div>`
    o.hidden = false
    o.onclick = e => {
      const r = e.target.dataset.r; if (!r && e.target !== o) return
      o.hidden = true
      if (r === 's') resolve(Object.fromEntries(fields.map((f, i) => { const v = o.querySelector(`[data-i="${i}"]`).value; return [f.k, f.type === 'number' ? (v === '' ? null : Math.round(Number(v))) : f.num ? Number(v) : v] })))
      else resolve(r === 'd' ? { _del: true } : null)
    }
  })
}
const confirmDel = r => r?._del ? confirm('Hapus item ini?') : !!r

// ---------- transaction form ----------
function txForm(t) {
  const f = t ? { ...t, _o: t } : { kind: 'expense', date: today(), amount: '', account_id: S.accts[0]?.id ?? null, to_account_id: null, category_id: null, note: '' }
  const fm = $('#fm'), close = () => { fm.hidden = true; fm.innerHTML = '' }
  const catOpts = () => {
    const kind = f.kind === 'income' ? 'income' : 'expense'
    return '<option value="">—</option>' + S.cats.filter(c => c.kind === kind && !c.parent_id).map(p =>
      `<option value="${p.id}"${f.category_id === p.id ? ' selected' : ''}>${esc(p.name)}</option>` +
      S.cats.filter(c => c.parent_id === p.id).map(c => `<option value="${c.id}"${f.category_id === c.id ? ' selected' : ''}>${esc(p.name)} › ${esc(c.name)}</option>`).join('')).join('')
  }
  const accOpts = sel => S.accts.map(a => `<option value="${a.id}"${sel === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')
  const hint = () => {
    if (f.kind !== 'expense' || !f.category_id || String(f.date).slice(0, 7) !== S.month) return ''
    const b = S.sum.budgets.find(x => x.categoryId === family(f.category_id)); if (!b || !b.budget) return ''
    let rem = b.remaining; const o = f._o
    if (o && o.kind === 'expense' && o.date.slice(0, 7) === S.month && family(o.category_id) === b.categoryId) rem += o.amount
    return `Sisa budget ${esc(b.name)}: ${fmt(rem)} → <b class="${rem - (+f.amount || 0) < 0 ? 'ex' : ''}">${fmt(rem - (+f.amount || 0))}</b>`
  }
  const draw = () => {
    fm.innerHTML = `<div class="in-wrap"><header>${t ? 'Edit' : 'Transaksi baru'}</header>
      <div class="seg">${['income', 'expense', 'transfer'].map(k => `<button data-k="${k}" class="${f.kind === k ? 'on' : ''}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>
      <div class="f"><label>Tanggal</label><input type="date" name="date" value="${esc(f.date)}"></div>
      <div class="f amt"><label>Jumlah</label><input name="amount" inputmode="numeric" placeholder="0" value="${f.amount ? fmt(f.amount) : ''}"></div>
      ${f.kind === 'transfer' ? '' : `<div class="f"><label>Kategori</label><select name="category_id">${catOpts()}</select></div>`}
      <div class="f"><label>${f.kind === 'transfer' ? 'Dari' : 'Account'}</label><select name="account_id">${accOpts(f.account_id)}</select></div>
      ${f.kind === 'transfer' ? `<div class="f"><label>Ke</label><select name="to_account_id">${accOpts(f.to_account_id ?? S.accts.find(a => a.id !== f.account_id)?.id)}</select></div>` : ''}
      <div class="f"><label>Catatan</label><input name="note" value="${esc(f.note)}"></div>
      <div class="hint" id="hint">${hint()}</div>
      <div class="acts"><button data-r="x">Batal</button>${t ? '<button data-r="d" class="danger">Hapus</button>' : ''}<button data-r="s" class="pri">Simpan</button></div></div>`
    fm.hidden = false
  }
  fm.oninput = fm.onchange = e => {
    const n = e.target.name; if (!n) return
    if (n === 'amount') { f.amount = Number(e.target.value.replace(/\D/g, '')); e.target.value = f.amount ? fmt(f.amount) : '' }
    else f[n] = ['category_id', 'account_id', 'to_account_id'].includes(n) ? (e.target.value ? Number(e.target.value) : null) : e.target.value
    $('#hint').innerHTML = hint()
  }
  fm.onclick = guard(async e => {
    const b = e.target.closest('button'); if (!b) return
    if (b.dataset.k) { f.kind = b.dataset.k; if (f.kind !== 'transfer') f.to_account_id = null; else f.category_id = null; if (f.category_id && cat(f.category_id)?.kind !== (f.kind === 'income' ? 'income' : 'expense')) f.category_id = null; return draw() }
    if (b.dataset.r === 'x') return close()
    if (b.dataset.r === 'd') { if (!confirm('Hapus transaksi ini?')) return; await api('DELETE', 'transactions/' + t.id); close(); return load() }
    if (b.dataset.r === 's') {
      const p = { date: f.date, kind: f.kind, amount: f.amount, account_id: f.account_id, to_account_id: f.kind === 'transfer' ? (f.to_account_id ?? fm.querySelector('[name=to_account_id]').value | 0) : null, category_id: f.kind === 'transfer' ? null : f.category_id, note: f.note ?? '' }
      if (t) { await api('PUT', 'transactions/' + t.id, { ...p, flag: null }) } else await api('POST', 'transactions', p)
      close(); load()
    }
  })
  draw()
}

// ---------- actions ----------
const A = {
  tab: d => { S.tab = d.v; S.sub = null; render() },
  mon: d => { S.month = shiftMonth(S.month, +d.v); load() },
  add: () => txForm(),
  edit: d => txForm(S.txs.find(t => t.id === +d.id)),
  sTab: d => { S.sTab = d.v; render() }, sKind: d => { S.sKind = d.v; render() },
  sub: d => { S.sub = d.v; render() }, back: () => { S.sub = null; render() },
  logout: async () => { document.cookie = 'midas=; Max-Age=0; Path=/'; showLogin() },
  catAdd: async d => {
    const parent = d.parent ? +d.parent : null
    const r = await ask(parent ? 'Sub kategori baru' : 'Kategori baru', [{ k: 'name', label: 'Nama' }, ...(parent || d.kind === 'income' ? [] : [{ k: 'monthly_budget', label: 'Budget per bulan (Rp)', type: 'number', value: 0 }])])
    if (r?.name) { await api('POST', 'categories', { name: r.name, kind: d.kind, parent_id: parent, monthly_budget: r.monthly_budget ?? 0 }); load() }
  },
  catEdit: async d => {
    const c = cat(+d.id), top = !c.parent_id
    const r = await ask('Edit kategori', [{ k: 'name', label: 'Nama', value: c.name }, ...(top && c.kind === 'expense' ? [{ k: 'monthly_budget', label: 'Budget per bulan (Rp)', type: 'number', value: c.monthly_budget }] : [])], true)
    if (!confirmDel(r)) return
    if (r._del) await api('DELETE', 'categories/' + c.id); else await api('PUT', 'categories/' + c.id, r)
    load()
  },
  grpAdd: async () => { const r = await ask('Group baru', [{ k: 'name', label: 'Nama (mis. BANK, Paylater)' }, { k: 'type', label: 'Tipe', options: [['asset', 'Asset'], ['liability', 'Liability']] }]); if (r?.name) { await api('POST', 'groups', r); load() } },
  grpEdit: async d => {
    const g = S.groups.find(x => x.id === +d.id)
    const r = await ask('Edit group', [{ k: 'name', label: 'Nama', value: g.name }, { k: 'type', label: 'Tipe', value: g.type, options: [['asset', 'Asset'], ['liability', 'Liability']] }], true)
    if (!confirmDel(r)) return
    if (r._del) await api('DELETE', 'groups/' + g.id); else await api('PUT', 'groups/' + g.id, r)
    load()
  },
  accAdd: async () => A._acc(null),
  accEdit: d => A._acc(S.accts.find(a => a.id === +d.id)),
  _acc: async a => {
    const r = await ask(a ? 'Edit account' : 'Account baru', [{ k: 'name', label: 'Nama', value: a?.name }, { k: 'group_id', label: 'Group', num: true, value: a?.group_id, options: S.groups.map(g => [g.id, `${g.name} (${g.type})`]) }, { k: 'opening_balance', label: 'Saldo awal (Rp, minus untuk utang)', type: 'number', value: a?.opening_balance ?? 0 }], !!a)
    if (!confirmDel(r)) return
    if (r._del) return (await api('DELETE', 'accounts/' + a.id), load())
    if (!r.name) return
    r.type = S.groups.find(g => g.id === r.group_id)?.type ?? 'asset'
    if (a) await api('PUT', 'accounts/' + a.id, r); else await api('POST', 'accounts', r)
    load()
  },
  recAdd: () => A._rec(null), recEdit: d => A._rec(S.rec.find(r => r.id === +d.id)),
  _rec: async x => {
    const r = await ask(x ? 'Edit rutin' : 'Transaksi rutin', [
      { k: 'note', label: 'Nama (mis. Cicilan KPR)', value: x?.note },
      { k: 'kind', label: 'Tipe', value: x?.kind ?? 'expense', options: [['expense', 'Expense'], ['income', 'Income']] },
      { k: 'amount', label: 'Jumlah (Rp)', type: 'number', value: x?.amount },
      { k: 'account_id', label: 'Account', num: true, value: x?.account_id, options: S.accts.map(a => [a.id, a.name]) },
      { k: 'category_id', label: 'Kategori', value: x?.category_id ?? '', options: [['', '—'], ...S.cats.map(c => [c.id, catName(c.id)])] },
      { k: 'day_of_month', label: 'Tanggal tiap bulan (1-31)', type: 'number', value: x?.day_of_month ?? 1 },
      { k: 'active', label: 'Status', num: true, value: x?.active ?? 1, options: [[1, 'Aktif'], [0, 'Nonaktif']] }], !!x)
    if (!confirmDel(r)) return
    if (r._del) return (await api('DELETE', 'recurring/' + x.id), load())
    r.category_id = r.category_id === '' ? null : Number(r.category_id)
    if (x) await api('PUT', 'recurring/' + x.id, r); else await api('POST', 'recurring', r)
    load()
  },
}
$('#app').onclick = e => { const t = e.target.closest('[data-a]'); if (t) guard(A[t.dataset.a])(t.dataset) }
load()
</script>
